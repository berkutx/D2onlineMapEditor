name: Deploy

# Push to main/master -> build on the GitHub runner, ship to lastwar, and restart d2editor.
# The 2 GB VPS deliberately does not compile the Vite bundle: doing so under production load
# causes memory reclaim / 100% I/O pressure and can stall the whole host.
# Public access is
# provided by the existing lastwar_nginx container on the server IP:
#   http://151.115.56.12/map/ -> http://d2editor:3000
# Both containers communicate only through the shared d2map_net Docker network.
#
# The 253 MB atlas set is NOT shipped here (it is gitignored + not reproducible in CI without
# the game install) — populate the d2editor_assets volume once from the dev box (see README).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-d2editor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image on runner
        run: |
          set -euo pipefail
          docker build \
            --build-arg VITE_BASE=/map/ \
            --build-arg VITE_COPILOT_LLM=off \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag d2editor:local \
            .

      - name: Ship code and image (tar over ssh; server has no rsync)
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          D2_INTEGRATION_SECRET: ${{ secrets.D2_INTEGRATION_SECRET }}
          VOICE_INTEGRATION_ENABLED: ${{ vars.VOICE_INTEGRATION_ENABLED }}
          VOICE_INTEGRATION_CLIENTS: ${{ vars.VOICE_INTEGRATION_CLIENTS }}
          VOICE_PUBLIC_ORIGIN: ${{ vars.VOICE_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          SSHOPTS="-i key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          REMOTE="$SERVER_USERNAME@$SERVER_HOST"
          ssh $SSHOPTS "$REMOTE" 'mkdir -p ~/d2editor'
          # ship code only; node_modules/dist/assets/volumes are excluded (built in-image /
          # persisted). CRITICAL: exclude ./key — the SSH private key written above must NEVER
          # be tarred to the server.
          tar czf - \
            --exclude='./key' --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='.env' \
            --exclude='**/node_modules' --exclude='dist' --exclude='**/dist' \
            --exclude='public/assets' --exclude='var' --exclude='scratchpad' \
            . | ssh $SSHOPTS "$REMOTE" 'tar xzf - -C ~/d2editor'
          # Stream the already-built image directly into Docker. No temporary archive is left on
          # the small VPS disk, and the currently running container keeps serving during transfer.
          docker save d2editor:local | gzip -1 | \
            ssh $SSHOPTS "$REMOTE" 'gzip -d | docker load'
          ssh $SSHOPTS "$REMOTE" \
            "docker image inspect d2editor:local --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}'"
          EXIST=$(ssh $SSHOPTS "$REMOTE" 'cat ~/d2editor/.env 2>/dev/null' || true)
          keep(){ printf '%s\n' "$EXIST" | grep -E "^$1=" | head -1 | cut -d= -f2- || true; }
          D2_INTEGRATION_SECRET="${D2_INTEGRATION_SECRET:-$(keep D2_INTEGRATION_SECRET)}"
          VOICE_INTEGRATION_ENABLED="${VOICE_INTEGRATION_ENABLED:-$(keep VOICE_INTEGRATION_ENABLED)}"
          VOICE_INTEGRATION_ENABLED="${VOICE_INTEGRATION_ENABLED:-off}"
          VOICE_INTEGRATION_CLIENTS="${VOICE_INTEGRATION_CLIENTS:-$(keep VOICE_INTEGRATION_CLIENTS)}"
          VOICE_PUBLIC_ORIGIN="${VOICE_PUBLIC_ORIGIN:-$(keep VOICE_PUBLIC_ORIGIN)}"
          VOICE_PUBLIC_ORIGIN="${VOICE_PUBLIC_ORIGIN:-http://151.115.56.12}"
          test -n "$D2_INTEGRATION_SECRET" || { echo 'Missing GitHub secret D2_INTEGRATION_SECRET'; exit 1; }
          umask 077
          {
            printf 'D2_INTEGRATION_SECRET=%s\n' "$D2_INTEGRATION_SECRET"
            printf 'VOICE_INTEGRATION_ENABLED=%s\n' "$VOICE_INTEGRATION_ENABLED"
            printf 'VOICE_INTEGRATION_CLIENTS=%s\n' "$VOICE_INTEGRATION_CLIENTS"
            printf 'VOICE_PUBLIC_ORIGIN=%s\n' "$VOICE_PUBLIC_ORIGIN"
          } > env.out
          ssh $SSHOPTS "$REMOTE" 'cat > ~/d2editor/.env && chmod 600 ~/d2editor/.env' < env.out

      - name: Restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # There is no compilation here; leave enough room for image unpacking and health checks
          # on a busy host without permitting an indefinitely hung restart.
          command_timeout: 15m
          script: |
            cd ~/d2editor
            # The data disk is fstab-nofail: after a reboot without it, /mnt/data is an EMPTY dir on
            # the root FS. `docker run -v` would then silently manufacture /mnt/data/d2editor on the
            # root disk and every op-log/upload written since would be shadowed (lost) when the disk
            # remounts — so ABORT the deploy instead when the mount is gone.
            mountpoint -q /mnt/data || { echo "FATAL: /mnt/data is not mounted — refusing to deploy onto the root disk"; exit 1; }
            # Bind-backed volume device dirs MUST exist before `up` (type:none bind mounts fail on a
            # missing dir → the container won't start). Idempotent; created via docker so it works
            # without host sudo (the daemon runs as root). `rooms` is the durable collab op-log.
            docker run --rm -v /mnt/data/d2editor:/d alpine mkdir -p /d/rooms /d/uploads /d/projects || true
            # The image was compiled on the GitHub runner and loaded in the previous step. The OLD
            # container keeps serving until Compose recreates it from that complete local image.
            # Project name "d2editor" is separate from "d2mapeditor"; --remove-orphans is scoped to
            # THIS project. --no-build is intentional: production must never compile on this VPS.
            docker compose up -d --no-build --force-recreate --remove-orphans
            # nginx owns the public ports. Reconnect it idempotently in case the lastwar stack
            # was recreated since the previous editor deployment.
            docker inspect lastwar_nginx >/dev/null 2>&1 || { echo "FATAL: lastwar_nginx is missing"; exit 1; }
            if ! docker inspect --format '{{json .NetworkSettings.Networks}}' lastwar_nginx | grep -q '"d2map_net"'; then
              docker network connect d2map_net lastwar_nginx
            fi
            docker exec lastwar_nginx nginx -t
            docker exec lastwar_nginx nginx -s reload
            docker image prune -f || true   # drop the now-dangling previous image
            df -h / | tail -1
            # surface the container's own logs + fail the deploy if it isn't actually serving
            sleep 8
            echo "=== d2editor logs (tail) ==="
            docker logs --tail 120 d2editor 2>&1 || true
            echo "=== health check (inside the container) ==="
            docker exec d2editor node -e "fetch('http://localhost:3000/map/api/health').then(r=>r.text()).then(t=>{console.log('HEALTH OK',t)}).catch(e=>{console.error('HEALTH FAIL',e.message);process.exit(1)})"
            echo "=== health check (through IP nginx route) ==="
            curl --fail --silent --show-error -H 'Host: 151.115.56.12' http://127.0.0.1/map/api/health >/dev/null
