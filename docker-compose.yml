# d2-web-editor — its own isolated stack on lastwar. No host ports are published: the
# shared lastwar_nginx container reaches it through d2map_net and exposes /map/ on the IP.
name: d2editor

services:
  app:
    build:
      context: .
      args:
        VITE_BASE: "/map/"
        VITE_COPILOT_LLM: "off"
    image: d2editor:local
    container_name: d2editor
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_PATH: /map
      COPILOT_LLM: "off"
      WEB_DIST: /app/apps/web/dist
      ASSETS_DIR: /app/public/assets
      SCENARIO_ROOTS: /app/deploy/scenarios
      UPLOAD_DIR: /app/var/uploads
      PROJECTS_DIR: /app/var/projects
      # durable per-room collab op-logs — MUST be a volume, else every redeploy (image
      # rebuild = fresh container FS) wipes the room history and clients have to re-seed
      ROOMS_DIR: /app/var/rooms
      LLM_DIR: /app/var/llm
      VOICE_INTERNAL_URL: http://d2map_app:3456
      VOICE_PUBLIC_BASE_PATH: /dialogeditor
      D2_INTEGRATION_SECRET: ${D2_INTEGRATION_SECRET:?set the same strong secret in both stacks}
      VOICE_INTEGRATION_ENABLED: ${VOICE_INTEGRATION_ENABLED:-off}
      VOICE_INTEGRATION_CLIENTS: ${VOICE_INTEGRATION_CLIENTS:-}
    volumes:
      # atlases (253 MB) are NOT in git — populate this volume once from the dev box (see README)
      - d2editor_assets:/app/public/assets:ro
      - d2editor_uploads:/app/var/uploads
      - d2editor_projects:/app/var/projects
      - d2editor_rooms:/app/var/rooms
    networks: [d2map_net]

networks:
  d2map_net:
    external: true
    name: d2map_net

# Volumes are named (stable for CI + the asset-upload command) but BIND-BACKED onto the
# dedicated data disk mounted at /mnt/data (ext4 label d2data, in fstab) — the 9 GB system
# disk is shared with other stacks and was running out. The device dirs must exist before
# `up` (they do; see deploy/README.md). Data copied from the old volumes on 2026-07-02.
volumes:
  d2editor_assets:
    name: d2editor_assets
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/d2editor/assets
  d2editor_uploads:
    name: d2editor_uploads
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/d2editor/uploads
  d2editor_projects:
    name: d2editor_projects
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/d2editor/projects
  d2editor_rooms:
    name: d2editor_rooms
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/d2editor/rooms
